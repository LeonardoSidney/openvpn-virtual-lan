name: openvpn-containers
x-environment: &environments
  HOST_ADDR: "${HOST_ADDR:?missing, copy .env.example to .env}"
  HOST_PORT: "${HOST_PORT:?missing, copy .env.example to .env}"
  HOST_PROTOCOL: "${HOST_PROTOCOL:?missing, copy .env.example to .env}"
  VPN_NETWORK: "${VPN_NETWORK:?missing, copy .env.example to .env}"
  VPN_NETMASK: "${VPN_NETMASK:?missing, copy .env.example to .env}"
  EASYRSA_SERVER: "/easy-rsa-server"
  EASYRSA_CLIENT: "/easy-rsa-client"
  OPENVPN_DIR: "/openvpn"
services:
  ca-machine:
    environment:
      <<: *environments
    volumes:
      - ./volumes/ca-machine/easy-rsa:/easy-rsa-server
      - ./volumes/openvpn-machine/easy-rsa:/easy-rsa-client
      - ./volumes/openvpn-machine/openvpn:/openvpn
    build:
      context: .
      dockerfile: ./build/ca-machine/Dockerfile
    
  openvpn-machine:
    environment:
      <<: *environments
    build:
      context: .
      dockerfile: ./build/openvpn-machine/Dockerfile
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
    - NET_ADMIN
    networks:
      - proxy-network
    volumes:
      - ./volumes/openvpn-machine/openvpn:/openvpn
      - ./volumes/openvpn-machine/easy-rsa:/easy-rsa
    ports:
      - ${HOST_PORT:?missing, copy .env.example to .env}:1194/udp
      - ${HOST_PORT:?missing, copy .env.example to .env}:1194/tcp
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_forward=1
  # proxy:
  #   depends_on:
  #     - openvpn-machine
  #   networks:
  #     - proxy-network
  #   volumes:
  #     - ./volumes/proxy:/etc/nginx/
  #   build:
  #     context: .
      
      
networks:
  proxy-network:
    driver: bridge